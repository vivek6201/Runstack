root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/execution-engine"
  cmd = "go build -o ./tmp/execution-engine ./cmd/server"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  stop_on_error = true

[log]
  main_only = false
  silent = false
  time = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
